<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShadowTale.pl — Heartache</title>

    <link rel="icon" href="assets/logo.png">

    <style>
        :root {
            --bg: #050509;
            --panel: rgba(15, 12, 25, 0.96);
            --purple: #9b5cff;
            --purple2: #6d35c9;
            --text: #ffffff;
            --muted: #aaa4b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    rgba(155, 92, 255, 0.16),
                    transparent 45%
                ),
                #050509;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            background: rgba(5, 5, 9, 0.95);
            border-bottom: 1px solid rgba(155, 92, 255, 0.25);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .logo span {
            color: var(--purple);
        }

        main {
            width: min(1100px, calc(100% - 30px));
            margin: 45px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #cdb7ff;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        .music-box {
            background: var(--panel);
            border: 1px solid rgba(155, 92, 255, 0.25);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .versions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .version {
            padding: 25px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(155, 92, 255, 0.2);
            cursor: pointer;
            transition: 0.2s;
        }

        .version:hover {
            transform: translateY(-4px);
            border-color: var(--purple);
            background: rgba(155, 92, 255, 0.1);
            box-shadow: 0 10px 30px rgba(155, 92, 255, 0.12);
        }

        .version-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .version h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .version p {
            color: var(--muted);
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                var(--purple),
                var(--purple2)
            );
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .button.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .overlay.active {
            display: flex;
        }

        .player {
            width: min(1000px, 100%);
            background: #0b0912;
            border: 1px solid rgba(155, 92, 255, 0.35);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .player-title {
            font-size: 21px;
            font-weight: bold;
        }

        .close {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 23px;
            cursor: pointer;
        }

        .close:hover {
            background: rgba(255, 84, 112, 0.2);
        }

        video {
            width: 100%;
            max-height: 70vh;
            display: block;
            background: black;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            header {
                padding: 0 15px;
            }

            main {
                width: calc(100% - 20px);
                margin: 25px auto;
            }

            .music-box {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .versions {
                grid-template-columns: 1fr;
            }

            .player {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="ShadowTale">
        Shadow<span>Tale.pl</span>
    </a>
</header>

<main>

    <a href="muzyka.html" class="back">
        ← Powrót do muzyki
    </a>

    <section class="music-box">

        <h1>Heartache</h1>

        <p class="subtitle">
            Undertale — Heartache
        </p>

        <div class="versions">

            <!-- ANGIELSKI -->
            <div
                class="version"
                onclick="openPlayer(
                    '🇬🇧 Heartache — Angielski',
                    'assets/music/heartache-en.mp4'
                )"
            >
                <div class="version-icon">🇬🇧</div>

                <h2>Angielski</h2>

                <p>
                    Oryginalna wersja angielska.
                </p>
            </div>


            <!-- POLSKI -->
            <div
                class="version"
                onclick="openPlayer(
                    '🇵🇱 Heartache — Polski',
                    'assets/music/heartache-pl.mp4'
                )"
            >
                <div class="version-icon">🇵🇱</div>

                <h2>Polski</h2>

                <p>
                    Polska wersja utworu.
                </p>
            </div>

        </div>

        <div class="buttons">

            <a href="muzyka.html" class="button">
                🎵 Wszystkie utwory
            </a>

            <a href="index.html" class="button secondary">
                🏠 Strona główna
            </a>

        </div>

    </section>

</main>


<!-- NAKŁADKA Z FILMEM -->

<div id="overlay" class="overlay">

    <div class="player">

        <div class="player-header">

            <div id="player-title" class="player-title">
                Odtwarzanie
            </div>

            <button
                class="close"
                onclick="closePlayer()"
                aria-label="Zamknij"
            >
                ✕
            </button>

        </div>

        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        >
            Twoja przeglądarka nie obsługuje odtwarzania MP4.
        </video>

    </div>

</div>


<script>

    const overlay = document.getElementById("overlay");
    const video = document.getElementById("video");
    const playerTitle = document.getElementById("player-title");


    function openPlayer(title, file) {

        playerTitle.textContent = title;

        video.pause();

        video.src = file;

        video.load();

        overlay.classList.add("active");
    }


    function closePlayer() {

        video.pause();

        video.removeAttribute("src");

        video.load();

        overlay.classList.remove("active");
    }


    overlay.addEventListener("click", function(event) {

        if (event.target === overlay) {
            closePlayer();
        }

    });


    document.addEventListener("keydown", function(event) {

        if (event.key === "Escape") {
            closePlayer();
        }

    });

</script>

</body>
</html>
