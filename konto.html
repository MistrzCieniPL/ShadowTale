<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Moje konto — ShadowTale</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<canvas id="stars"></canvas>


<header class="navbar">

    <div class="logo">
        SHADOW<span>TALE</span>
    </div>

    <nav>

        <a href="index.html">
            Strona główna
        </a>

        <a href="minecraft.html">
            Minecraft
        </a>

        <a href="undertale.html">
            Undertale
        </a>

        <a href="konto.html">
            Konto
        </a>

    </nav>

</header>


<main>

<section class="hero category-hero">

    <div class="hero-content">

        <div class="small-title">
            ✦ SHADOWTALE • KONTO ✦
        </div>

        <h1>
            Moje konto
        </h1>


        <div class="account-box">

            <div class="account-avatar">
                👤
            </div>


            <h2 id="account-username">
                Ładowanie...
            </h2>


            <p id="account-email">
                Ładowanie...
            </p>


            <div class="account-actions">

                <a
                    href="index.html"
                    class="button secondary"
                >
                    Strona główna
                </a>


                <button
                    id="logout-button"
                    class="button primary"
                >
                    Wyloguj się
                </button>

            </div>


            <div
                id="account-message"
                class="auth-message"
            ></div>

        </div>

    </div>

</section>


<section class="projects">

    <div class="section-title">

        <span>
            SHADOWTALE
        </span>

        <h2>
            Moje zakupy
        </h2>

    </div>


    <div class="empty-products">

        <p>
            🛒 Nie masz jeszcze żadnych zakupów.
        </p>

        <a
            href="minecraft.html"
            class="button secondary"
        >
            Przeglądaj Minecraft
        </a>

    </div>

</section>

</main>


<footer>

    <div class="logo">
        SHADOW<span>TALE</span>
    </div>

    <p>
        © 2026 ShadowTale
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="scripts.js"></script>

</body>

</html>
