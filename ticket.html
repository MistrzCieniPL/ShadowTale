<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickety — ShadowTale</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg: #070914;
            --panel: #0d1020;
            --panel2: #111628;
            --border: rgba(139,92,246,.18);
            --purple: #8b5cf6;
            --purple-dark: #5b21b6;
            --text: #f5f5f7;
            --muted: #8b94aa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(124,58,237,.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(37,99,235,.08),
                    transparent 28%
                ),
                var(--bg);
            font-family: Inter, Arial, sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            width: min(1180px, calc(100% - 30px));
            margin: auto;
            padding: 30px 0 60px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 18px;
            margin-bottom: 30px;
            border: 1px solid rgba(139,92,246,.18);
            border-radius: 20px;
            background: rgba(13,16,32,.82);
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
        }

        .logo-link img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 12px;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo-subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .account {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 13px;
            background: rgba(255,255,255,.035);
            color: white;
            text-decoration: none;
        }

        .account:hover {
            background: rgba(139,92,246,.1);
            border-color: rgba(139,92,246,.3);
        }

        .account img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 50%;
        }

        .account span {
            font-size: 13px;
            font-weight: 800;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            margin-bottom: 22px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(30px, 5vw, 43px);
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           ALERT
        ========================= */

        .alert {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 13px;
            font-size: 13px;
            line-height: 1.5;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            color: #fecaca;
            background: rgba(239,68,68,.09);
            border: 1px solid rgba(239,68,68,.2);
        }

        .alert.success {
            color: #bbf7d0;
            background: rgba(34,197,94,.09);
            border: 1px solid rgba(34,197,94,.2);
        }

        /* =========================
           LAYOUT
        ========================= */

        .grid {
            display: grid;
            grid-template-columns: 350px minmax(0, 1fr);
            gap: 20px;
        }

        .panel {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(13,16,32,.86);
            box-shadow: 0 15px 50px rgba(0,0,0,.22);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px 19px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .panel-header h2 {
            margin: 0;
            font-size: 16px;
        }

        .panel-content {
            padding: 20px;
        }

        /* =========================
           FORM
        ========================= */

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #b8c0d3;
            font-size: 12px;
            font-weight: 800;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            outline: none;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            padding: 12px 13px;
            background: rgba(255,255,255,.045);
            color: white;
            transition: .18s;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: rgba(139,92,246,.5);
            box-shadow: 0 0 0 3px rgba(139,92,246,.08);
        }

        .field textarea {
            min-height: 125px;
            resize: vertical;
        }

        select option {
            background: #111628;
        }

        .primary {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #5b21b6
            );
            font-weight: 900;
            box-shadow: 0 8px 25px rgba(124,58,237,.2);
            transition: .18s;
        }

        .primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           TICKET LIST
        ========================= */

        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ticket {
            width: 100%;
            padding: 14px;
            text-align: left;
            color: white;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 15px;
            background: rgba(255,255,255,.025);
            transition: .18s;
        }

        .ticket:hover,
        .ticket.active {
            transform: translateY(-1px);
            background: rgba(139,92,246,.08);
            border-color: rgba(139,92,246,.32);
        }

        .ticket-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .ticket-title {
            font-size: 13px;
            font-weight: 850;
        }

        .ticket-date {
            color: #69728a;
            font-size: 10px;
            white-space: nowrap;
        }

        .ticket-info {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 9px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
        }

        .badge-type {
            color: #aeb7cb;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.06);
        }

        .badge-open {
            color: #86efac;
            background: rgba(34,197,94,.1);
            border: 1px solid rgba(34,197,94,.18);
        }

        .badge-closed {
            color: #fca5a5;
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.18);
        }

        .unread {
            margin-left: auto;
            color: #c4b5fd;
            font-size: 10px;
            font-weight: 900;
        }

        .empty {
            padding: 35px 10px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .refresh {
            padding: 7px 10px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 9px;
            background: rgba(255,255,255,.04);
            color: #aeb6ca;
            font-size: 11px;
            font-weight: 800;
        }

        /* =========================
           MODAL
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(2,4,12,.8);
            backdrop-filter: blur(12px);
        }

        .overlay.open {
            display: flex;
        }

        .modal {
            width: min(850px, 100%);
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(139,92,246,.22);
            border-radius: 22px;
            background: #0c1020;
            box-shadow: 0 30px 100px rgba(0,0,0,.55);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .modal-heading {
            min-width: 0;
        }

        .modal-heading h2 {
            margin: 0;
            overflow: hidden;
            font-size: 17px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-chips {
            display: flex;
            gap: 6px;
            margin-top: 7px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 4px 8px;
            border-radius: 999px;
            color: #929bb0;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.07);
            font-size: 9px;
            font-weight: 800;
        }

        .close {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            background: rgba(255,255,255,.04);
            color: #adb5c8;
            font-size: 20px;
        }

        .close:hover {
            color: white;
            background: rgba(239,68,68,.1);
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 260px;
            max-height: 56vh;
            padding: 20px;
            overflow-y: auto;
        }

        .messages::-webkit-scrollbar {
            width: 7px;
        }

        .messages::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(139,92,246,.32);
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-row.admin {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            overflow: hidden;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            box-shadow: 0 5px 18px rgba(0,0,0,.25);
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-avatar.admin {
            border-color: rgba(139,92,246,.45);
            box-shadow:
                0 0 0 3px rgba(139,92,246,.08),
                0 5px 20px rgba(124,58,237,.25);
        }

        .message-stack {
            display: flex;
            flex-direction: column;
            max-width: min(75%, 720px);
            min-width: 0;
        }

        .message-row.mine .message-stack {
            align-items: flex-end;
        }

        .message-row.admin .message-stack {
            align-items: flex-start;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0 6px 6px;
        }

        .author {
            color: #f3f4f6;
            font-size: 12px;
            font-weight: 850;
        }

        .role {
            padding: 2px 7px;
            border-radius: 999px;
            color: #c4b5fd;
            background: rgba(139,92,246,.15);
            border: 1px solid rgba(139,92,246,.25);
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .admin .role {
            color: #93c5fd;
            background: rgba(96,165,250,.12);
            border-color: rgba(96,165,250,.24);
        }

        .time {
            color: #6f7892;
            font-size: 10px;
            white-space: nowrap;
        }

        .bubble {
            position: relative;
            padding: 12px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            box-shadow: 0 8px 25px rgba(0,0,0,.18);
        }

        .mine .bubble {
            color: white;
            background: linear-gradient(
                135deg,
                rgba(124,58,237,.94),
                rgba(91,33,182,.8)
            );
            border: 1px solid rgba(167,139,250,.25);
            border-bottom-right-radius: 5px;
        }

        .admin .bubble {
            color: #e7eaf2;
            background: linear-gradient(
                135deg,
                #1e2334,
                #161b2a
            );
            border: 1px solid rgba(139,92,246,.18);
            border-bottom-left-radius: 5px;
        }

        /* =========================
           REPLY
        ========================= */

        .reply {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,.06);
            background: rgba(8,11,22,.9);
        }

        .reply textarea {
            flex: 1;
            min-height: 46px;
            max-height: 150px;
            resize: vertical;
            outline: none;
            padding: 13px 14px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 13px;
            background: rgba(255,255,255,.045);
            color: white;
        }

        .reply textarea:focus {
            border-color: rgba(139,92,246,.4);
            box-shadow: 0 0 0 3px rgba(139,92,246,.07);
        }

        .reply textarea::placeholder {
            color: #69728b;
        }

        .send {
            min-height: 46px;
            padding: 0 18px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(135deg,#7c3aed,#5b21b6);
            color: white;
            font-weight: 900;
        }

        .send:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .closed {
            display: none;
            padding: 14px 20px;
            border-top: 1px solid rgba(255,255,255,.06);
            color: #8992a8;
            text-align: center;
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .page {
                width: calc(100% - 16px);
                padding-top: 10px;
            }

            .header {
                border-radius: 16px;
                padding: 12px;
            }

            .logo-subtitle {
                display: none;
            }

            .logo-title {
                font-size: 17px;
            }

            .hero h1 {
                font-size: 29px;
            }

            .panel-content {
                padding: 15px;
            }

            .overlay {
                padding: 7px;
            }

            .modal {
                max-height: 97vh;
                border-radius: 18px;
            }

            .messages {
                padding: 15px 11px;
                gap: 15px;
                max-height: 59vh;
            }

            .message-avatar {
                width: 32px;
                height: 32px;
                min-width: 32px;
            }

            .message-stack {
                max-width: 82%;
            }

            .bubble {
                padding: 10px 12px;
                font-size: 13px;
                border-radius: 15px;
            }

            .role {
                display: none;
            }

            .time {
                font-size: 9px;
            }

            .reply {
                padding: 8px;
            }

            .send {
                padding: 0 13px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <a href="index.html" class="logo-link">
            <img src="assets/logo.png" alt="ShadowTale">

            <div>
                <div class="logo-title">SHADOWTALE</div>
                <div class="logo-subtitle">Centrum pomocy</div>
            </div>
        </a>

        <a href="konto.html" class="account">
            <img id="account-avatar" src="assets/logo.png" alt="">
            <span id="account-name">Konto</span>
        </a>

    </header>

    <section class="hero">
        <h1>Tickety</h1>
        <p>Skontaktuj się z administracją ShadowTale i sprawdź swoje zgłoszenia.</p>
    </section>

    <div id="alert" class="alert"></div>

    <main id="content" class="grid" style="display:none;">

        <!-- NOWY TICKET -->

        <section class="panel">

            <div class="panel-header">
                <h2>Nowy ticket</h2>
            </div>

            <div class="panel-content">

                <form id="ticket-form">

                    <div class="field">
                        <label for="subject">Temat</label>

                        <input
                            id="subject"
                            type="text"
                            maxlength="120"
                            placeholder="Np. Problem z zakupem"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="type">Typ</label>

                        <select id="type" required>
                            <option value="help">🆘 Pomoc</option>
                            <option value="question">❓ Pytanie</option>
                            <option value="technical">⚙️ Problem techniczny</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="category">Kategoria</label>

                        <select id="category" required>
                            <option value="other">Inne</option>
                            <option value="account">Konto</option>
                            <option value="purchase">Zakup / płatność</option>
                            <option value="minecraft">Minecraft</option>
                            <option value="undertale">Undertale</option>
                            <option value="website">Strona ShadowTale</option>
                            <option value="technical">Problem techniczny</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="message">Wiadomość</label>

                        <textarea
                            id="message"
                            maxlength="5000"
                            placeholder="Opisz dokładnie swój problem..."
                            required
                        ></textarea>
                    </div>

                    <button
                        id="create-ticket"
                        class="primary"
                        type="submit"
                    >
                        Utwórz ticket
                    </button>

                </form>

            </div>

        </section>


        <!-- TICKETY -->

        <section class="panel">

            <div class="panel-header">

                <h2>Twoje tickety</h2>

                <button
                    id="refresh"
                    class="refresh"
                    type="button"
                >
                    Odśwież
                </button>

            </div>

            <div class="panel-content">

                <div id="ticket-list" class="ticket-list">
                    <div class="empty">
                        Ładowanie ticketów...
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->

<div id="overlay" class="overlay">

    <div class="modal">

        <div class="modal-header">

            <div class="modal-heading">

                <h2 id="modal-title">
                    Ticket
                </h2>

                <div id="modal-chips" class="modal-chips"></div>

            </div>

            <button
                id="close"
                class="close"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="messages" class="messages">
            <div class="empty">
                Ładowanie wiadomości...
            </div>
        </div>


        <div id="reply" class="reply">

            <textarea
                id="reply-text"
                maxlength="5000"
                placeholder="Napisz wiadomość..."
            ></textarea>

            <button
                id="send"
                class="send"
                type="button"
            >
                Wyślij
            </button>

        </div>


        <div id="closed" class="closed">
            Ten ticket jest zamknięty.
        </div>

    </div>

</div>


<script>
"use strict";

let db = null;
let currentUser = null;
let currentTicket = null;
let currentAvatar = "assets/logo.png";


const $ = id => document.getElementById(id);


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function showAlert(message, type = "error") {

    const alert = $("alert");

    alert.textContent = message;
    alert.className = "alert show " + type;

    clearTimeout(showAlert.timer);

    showAlert.timer = setTimeout(() => {
        alert.className = "alert";
    }, 6000);
}


function formatDate(value) {

    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString("pl-PL", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


function formatShortDate(value) {

    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleDateString("pl-PL", {
        day: "2-digit",
        month: "2-digit"
    });
}


/* =========================
   SUPABASE
========================= */

function getSupabaseConfig() {

    if (
        !window.CONFIG ||
        !window.CONFIG.supabaseUrl ||
        !window.CONFIG.supabaseKey
    ) {
        throw new Error(
            "Nie znaleziono konfiguracji Supabase. Sprawdź config.js."
        );
    }

    return {
        url: window.CONFIG.supabaseUrl,
        key: window.CONFIG.supabaseKey
    };
}


function initSupabase() {

    if (!window.supabase) {
        throw new Error(
            "Biblioteka Supabase nie została załadowana."
        );
    }

    const config = getSupabaseConfig();

    db = window.supabase.createClient(
        config.url,
        config.key
    );
}


/* =========================
   SESJA
========================= */

async function loadSession() {

    const {
        data,
        error
    } = await db.auth.getSession();

    if (error) {
        throw error;
    }

    currentUser =
        data?.session?.user || null;

    if (!currentUser) {
        window.location.href = "login.html";
        return false;
    }

    return true;
}


/* =========================
   PROFIL
========================= */

async function loadProfile() {

    const {
        data,
        error
    } = await db
        .from("profiles")
        .select("username,avatar_url")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {
        console.warn(
            "Profil:",
            error.message
        );
    }

    const username =
        data?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email?.split("@")[0] ||
        "Klient";

    currentAvatar =
        data?.avatar_url ||
        currentUser.user_metadata?.avatar_url ||
        "assets/logo.png";

    $("account-name").textContent =
        username;

    $("account-avatar").src =
        currentAvatar;
}


/* =========================
   LABELKI
========================= */

function typeLabel(type) {

    const labels = {
        help: "🆘 Pomoc",
        question: "❓ Pytanie",
        technical: "⚙️ Problem techniczny"
    };

    return labels[type] || "Ticket";
}


function categoryLabel(category) {

    const labels = {
        other: "Inne",
        account: "Konto",
        purchase: "Zakup / płatność",
        minecraft: "Minecraft",
        undertale: "Undertale",
        website: "Strona ShadowTale",
        technical: "Problem techniczny"
    };

    return labels[category] || "Inne";
}


/* =========================
   LISTA TICKETÓW
========================= */

async function loadTickets() {

    const list = $("ticket-list");

    list.innerHTML =
        `<div class="empty">Ładowanie ticketów...</div>`;

    let result = await db
        .from("tickets")
        .select(
            "id,subject,type,category,status,created_at,updated_at"
        )
        .eq("user_id", currentUser.id)
        .order("updated_at", {
            ascending: false
        });

    /*
     * Fallback, jeśli tabela nie ma updated_at.
     */

    if (result.error) {

        result = await db
            .from("tickets")
            .select(
                "id,subject,type,category,status,created_at"
            )
            .eq("user_id", currentUser.id)
            .order("created_at", {
                ascending: false
            });
    }

    if (result.error) {

        console.error(result.error);

        list.innerHTML = `
            <div class="empty">
                Nie udało się pobrać ticketów.<br><br>
                <small>
                    ${escapeHtml(result.error.message)}
                </small>
            </div>
        `;

        return;
    }

    const tickets = result.data || [];

    if (!tickets.length) {

        list.innerHTML = `
            <div class="empty">
                Nie masz jeszcze żadnych ticketów.
            </div>
        `;

        return;
    }

    const html = [];

    for (const ticket of tickets) {

        let unread = false;

        const {
            data: lastMessage
        } = await db
            .from("ticket_messages")
            .select("author_id")
            .eq("ticket_id", ticket.id)
            .order("created_at", {
                ascending: false
            })
            .limit(1);

        if (
            lastMessage?.length &&
            lastMessage[0].author_id !== currentUser.id
        ) {
            unread = true;
        }

        html.push(`
            <button
                class="ticket ${
                    currentTicket?.id === ticket.id
                        ? "active"
                        : ""
                }"
                data-ticket="${escapeHtml(ticket.id)}"
                type="button"
            >

                <div class="ticket-title-row">

                    <span class="ticket-title">
                        ${escapeHtml(
                            ticket.subject || "Bez tematu"
                        )}
                    </span>

                    <span class="ticket-date">
                        ${escapeHtml(
                            formatShortDate(
                                ticket.updated_at ||
                                ticket.created_at
                            )
                        )}
                    </span>

                </div>

                <div class="ticket-info">

                    <span class="badge badge-type">
                        ${escapeHtml(
                            typeLabel(ticket.type)
                        )}
                    </span>

                    <span class="badge ${
                        ticket.status === "closed"
                            ? "badge-closed"
                            : "badge-open"
                    }">
                        ${
                            ticket.status === "closed"
                                ? "Zamknięty"
                                : "Otwarty"
                        }
                    </span>

                    ${
                        unread
                            ? `
                                <span class="unread">
                                    🔔 Nowa odpowiedź
                                </span>
                            `
                            : ""
                    }

                </div>

            </button>
        `);
    }

    list.innerHTML =
        html.join("");

    list
        .querySelectorAll("[data-ticket]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => openTicket(
                    button.dataset.ticket
                )
            );

        });
}


/* =========================
   OTWARCIE TICKETU
========================= */

async function openTicket(id) {

    const {
        data: ticket,
        error
    } = await db
        .from("tickets")
        .select(
            "id,subject,type,category,status,created_at,updated_at,user_id"
        )
        .eq("id", id)
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (error) {

        showAlert(error.message);

        return;
    }

    if (!ticket) {

        showAlert(
            "Nie znaleziono tego ticketu."
        );

        return;
    }

    currentTicket = ticket;

    $("modal-title").textContent =
        ticket.subject || "Ticket";

    $("modal-chips").innerHTML = `
        <span class="chip">
            ${escapeHtml(typeLabel(ticket.type))}
        </span>

        <span class="chip">
            ${escapeHtml(
                categoryLabel(ticket.category)
            )}
        </span>

        <span class="chip">
            ${
                ticket.status === "closed"
                    ? "Zamknięty"
                    : "Otwarty"
            }
        </span>
    `;

    $("overlay").classList.add("open");

    updateReplyState();

    await renderMessages();

    await loadTickets();
}


/* =========================
   WIADOMOŚCI
========================= */

async function renderMessages() {

    const box = $("messages");

    box.innerHTML =
        `<div class="empty">Ładowanie wiadomości...</div>`;

    const {
        data,
        error
    } = await db
        .from("ticket_messages")
        .select("*")
        .eq("ticket_id", currentTicket.id)
        .order("created_at", {
            ascending: true
        });

    if (error) {

        box.innerHTML = `
            <div class="empty">
                Nie udało się pobrać wiadomości.<br><br>
                <small>
                    ${escapeHtml(error.message)}
                </small>
            </div>
        `;

        return;
    }

    const messages = data || [];

    if (!messages.length) {

        box.innerHTML = `
            <div class="empty">
                Brak wiadomości.
            </div>
        `;

        return;
    }

    box.innerHTML = messages.map(message => {

        const mine =
            message.author_id === currentUser.id;

        const author = mine
            ? (
                currentUser.user_metadata?.username ||
                $("account-name").textContent ||
                "Klient"
            )
            : "ShadowTale";

        return `
            <div class="message-row ${
                mine ? "mine" : "admin"
            }">

                ${
                    !mine
                        ? `
                            <div class="message-avatar admin">
                                <img
                                    src="assets/logo.png"
                                    alt="ShadowTale"
                                >
                            </div>
                        `
                        : ""
                }

                <div class="message-stack">

                    <div class="message-meta">

                        <span class="author">
                            ${escapeHtml(author)}
                        </span>

                        <span class="role">
                            ${
                                mine
                                    ? "Klient"
                                    : "Administracja"
                            }
                        </span>

                        <span class="time">
                            ${escapeHtml(
                                formatDate(
                                    message.created_at
                                )
                            )}
                        </span>

                    </div>

                    <div class="bubble">
                        ${escapeHtml(
                            message.message
                        )}
                    </div>

                </div>

                ${
                    mine
                        ? `
                            <div class="message-avatar">
                                <img
                                    src="${escapeHtml(
                                        currentAvatar
                                    )}"
                                    alt=""
                                >
                            </div>
                        `
                        : ""
                }

            </div>
        `;
    }).join("");

    requestAnimationFrame(() => {
        box.scrollTop =
            box.scrollHeight;
    });
}


/* =========================
   NOWY TICKET
========================= */

async function createTicket(event) {

    event.preventDefault();

    const button =
        $("create-ticket");

    const subject =
        $("subject").value.trim();

    const type =
        $("type").value;

    const category =
        $("category").value;

    const message =
        $("message").value.trim();

    if (!subject || !message) {

        showAlert(
            "Uzupełnij temat i wiadomość."
        );

        return;
    }

    button.disabled = true;
    button.textContent = "Tworzenie...";

    try {

        const {
            data: ticket,
            error: ticketError
        } = await db
            .from("tickets")
            .insert({
                user_id: currentUser.id,
                subject,
                type,
                category,
                status: "open"
            })
            .select()
            .single();

        if (ticketError) {
            throw ticketError;
        }

        const {
            error: messageError
        } = await db
            .from("ticket_messages")
            .insert({
                ticket_id: ticket.id,
                author_id: currentUser.id,
                message
            });

        if (messageError) {
            throw messageError;
        }

        $("ticket-form").reset();

        showAlert(
            "Ticket został utworzony.",
            "success"
        );

        await loadTickets();

        await openTicket(ticket.id);

    } catch (error) {

        console.error(error);

        showAlert(
            error.message ||
            "Nie udało się utworzyć ticketu."
        );

    } finally {

        button.disabled = false;
        button.textContent = "Utwórz ticket";
    }
}


/* =========================
   ODPOWIEDŹ
========================= */

async function sendReply() {

    if (!currentTicket) {
        return;
    }

    if (currentTicket.status === "closed") {
        return;
    }

    const textarea =
        $("reply-text");

    const button =
        $("send");

    const message =
        textarea.value.trim();

    if (!message) {
        return;
    }

    button.disabled = true;
    button.textContent = "Wysyłanie...";

    try {

        const {
            error
        } = await db
            .from("ticket_messages")
            .insert({
                ticket_id: currentTicket.id,
                author_id: currentUser.id,
                message
            });

        if (error) {
            throw error;
        }

        /*
         * Nie blokujemy wysyłania wiadomości,
         * jeśli updated_at nie istnieje.
         */

        await db
            .from("tickets")
            .update({
                updated_at: new Date().toISOString()
            })
            .eq("id", currentTicket.id)
            .eq("user_id", currentUser.id);

        textarea.value = "";

        await renderMessages();
        await loadTickets();

    } catch (error) {

        console.error(error);

        showAlert(
            error.message ||
            "Nie udało się wysłać wiadomości."
        );

    } finally {

        button.disabled = false;
        button.textContent = "Wyślij";
        textarea.focus();
    }
}


/* =========================
   STAN TICKETU
========================= */

function updateReplyState() {

    if (!currentTicket) {
        return;
    }

    const closed =
        currentTicket.status === "closed";

    $("reply").style.display =
        closed ? "none" : "flex";

    $("closed").style.display =
        closed ? "block" : "none";
}


/* =========================
   ZAMKNIĘCIE MODALA
========================= */

function closeModal() {

    $("overlay").classList.remove("open");

    currentTicket = null;

    $("messages").innerHTML = "";

    $("reply-text").value = "";

    loadTickets();
}


/* =========================
   EVENTY
========================= */

$("ticket-form")
    .addEventListener(
        "submit",
        createTicket
    );

$("send")
    .addEventListener(
        "click",
        sendReply
    );

$("refresh")
    .addEventListener(
        "click",
        loadTickets
    );

$("close")
    .addEventListener(
        "click",
        closeModal
    );

$("overlay")
    .addEventListener(
        "click",
        event => {

            if (
                event.target === $("overlay")
            ) {
                closeModal();
            }

        }
    );

$("reply-text")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendReply();
            }

        }
    );

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            $("overlay").classList.contains("open")
        ) {
            closeModal();
        }

    }
);


/* =========================
   START
========================= */

async function start() {

    try {

        initSupabase();

        const logged =
            await loadSession();

        if (!logged) {
            return;
        }

        await loadProfile();

        $("content").style.display =
            "grid";

        await loadTickets();

        db.auth.onAuthStateChange(
            (event, session) => {

                if (
                    event === "SIGNED_OUT" ||
                    !session
                ) {
                    window.location.href =
                        "login.html";
                }

            }
        );

        setInterval(async () => {

            if (!currentTicket) {
                await loadTickets();
            }

        }, 15000);

    } catch (error) {

        console.error(error);

        showAlert(
            error.message ||
            "Nie udało się połączyć z Supabase."
        );
    }
}


start();
</script>
