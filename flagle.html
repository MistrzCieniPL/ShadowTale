<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowTale — Flagle</title>
<style>
:root{--bg:#050712;--panel:#0c1020;--panel2:#11172b;--purple:#9b5cff;--blue:#5865f2;--green:#39e58c;--red:#ff5470;--text:#f5f7ff;--muted:#9aa4c0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#202052 0,#090b18 45%,var(--bg) 75%);font-family:Arial,sans-serif;color:var(--text);display:flex;justify-content:center}
main{width:min(920px,94%);padding:28px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.brand{font-weight:900;font-size:25px}.brand span{color:var(--purple)}.back{color:white;text-decoration:none;background:#12182c;border:1px solid #252e4e;border-radius:12px;padding:10px 15px}.card{background:linear-gradient(145deg,#0d1224,#090d1a);border:1px solid #202946;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0008}.intro{text-align:center}.intro h1{margin:0 0 8px;font-size:36px}.intro p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:#0a0f20;border:1px solid #202946;border-radius:15px;padding:14px;text-align:center}.stat b{display:block;font-size:22px;margin-top:4px}.stat small{color:var(--muted)}.flag-box{width:min(720px,100%);aspect-ratio:3/2;margin:22px auto;position:relative;overflow:hidden;border-radius:16px;background:#05070e;border:2px solid #293252;box-shadow:0 10px 35px #0009}.flag-box img{width:100%;height:100%;object-fit:cover;display:block}.covers{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);z-index:2}.cover{background:linear-gradient(135deg,#151c35,#080c19);border:1px solid #303958;transition:opacity .35s,transform .35s}.cover.reveal{opacity:0;transform:scale(1.05);pointer-events:none}.controls{display:flex;gap:10px;max-width:720px;margin:auto}.controls input{flex:1;min-width:0;background:#080d1c;color:white;border:1px solid #303958;border-radius:13px;padding:14px 16px;font-size:16px;outline:none}.controls input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b5cff22}.btn{border:0;border-radius:13px;padding:0 19px;font-weight:800;color:white;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--blue));font-size:15px}.btn.secondary{background:#161d34;border:1px solid #303958}.btn.green{background:linear-gradient(135deg,#25c878,#168e59)}.btn.red{background:linear-gradient(135deg,#ff5470,#c52f4d)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.message{text-align:center;min-height:26px;margin-top:17px;font-weight:700}.message.good{color:var(--green)}.message.bad{color:var(--red)}.message.info{color:#b9c3ff}.hint{display:none;background:#151b31;border:1px solid #303958;border-radius:14px;padding:13px;text-align:center;margin:15px auto 0;max-width:500px}.hint.show{display:block}.result{display:none;margin:20px auto 0;max-width:620px;background:#11172b;border:1px solid #303958;border-radius:16px;padding:18px;text-align:center}.result.show{display:block}.result img{width:min(330px,100%);border-radius:10px;margin:10px 0}.result h2{margin:5px 0}.progress{display:flex;gap:6px;justify-content:center;margin-top:14px}.dot{width:35px;height:7px;border-radius:99px;background:#252d48}.dot.used{background:var(--purple)}.dot.current{background:#fff}.note{text-align:center;color:#69738e;font-size:12px;margin-top:18px}@media(max-width:620px){main{padding-top:18px}.top{align-items:flex-start}.intro h1{font-size:29px}.stats{grid-template-columns:1fr}.controls{flex-direction:column}.btn{height:48px}.flag-box{border-radius:11px}}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">Shadow<span>Tale</span> <small>• Flagle</small></div><a class="back" href="index.html">← Powrót</a></div>
<section class="card">
<div class="intro"><h1>🌍 Flagle</h1><p>Odgadnij państwo na podstawie jego flagi.</p></div>
<div class="stats">
<div class="stat"><small>PRÓBA</small><b id="attempt">1 / 6</b></div>
<div class="stat"><small>WYNIK</small><b id="score">0</b></div>
<div class="stat"><small>POZOSTAŁO</small><b id="left">6</b></div>
</div>
<div class="flag-box">
<img id="flag" alt="Ukryta flaga">
<div class="covers" id="covers"></div>
</div>
<div class="progress" id="progress"></div>
<div class="controls">
<input id="guess" list="countries" autocomplete="off" placeholder="Wpisz nazwę państwa...">
<datalist id="countries"></datalist>
<button class="btn" id="guessBtn">Zgadnij</button>
</div>
<div class="actions">
<button class="btn secondary" id="hintBtn">💡 Podpowiedź — kontynent</button>
<button class="btn red" id="giveBtn">🏳️ Poddaję się</button>
<button class="btn green" id="newBtn" style="display:none">🔄 Nowa gra</button>
</div>
<div id="hint" class="hint"></div>
<div id="message" class="message info"></div>
<div id="result" class="result"></div>
<div class="note">Po każdej błędnej odpowiedzi odkrywa się kolejny fragment flagi. Podpowiedź nie zabiera próby.</div>
</section>
</main>
<script>
const countries=[
["Afganistan","Azja","af"],["Albania","Europa","al"],["Algieria","Afryka","dz"],["Andora","Europa","ad"],["Angola","Afryka","ao"],["Antigua i Barbuda","Ameryka Północna","ag"],["Argentyna","Ameryka Południowa","ar"],["Armenia","Azja","am"],["Australia","Oceania","au"],["Austria","Europa","at"],["Azerbejdżan","Azja","az"],["Bahamy","Ameryka Północna","bs"],["Bahrajn","Azja","bh"],["Bangladesz","Azja","bd"],["Barbados","Ameryka Północna","bb"],["Belgia","Europa","be"],["Belize","Ameryka Północna","bz"],["Benin","Afryka","bj"],["Bhutan","Azja","bt"],["Białoruś","Europa","by"],["Boliwia","Ameryka Południowa","bo"],["Bośnia i Hercegowina","Europa","ba"],["Botswana","Afryka","bw"],["Brazylia","Ameryka Południowa","br"],["Brunei","Azja","bn"],["Bułgaria","Europa","bg"],["Burkina Faso","Afryka","bf"],["Burundi","Afryka","bi"],["Chile","Ameryka Południowa","cl"],["Chiny","Azja","cn"],["Chorwacja","Europa","hr"],["Cypr","Europa","cy"],["Czad","Afryka","td"],["Czarnogóra","Europa","me"],["Czechy","Europa","cz"],["Dania","Europa","dk"],["Dominika","Ameryka Północna","dm"],["Dominikana","Ameryka Północna","do"],["Dżibuti","Afryka","dj"],["Egipt","Afryka","eg"],["Ekwador","Ameryka Południowa","ec"],["Erytrea","Afryka","er"],["Estonia","Europa","ee"],["Eswatini","Afryka","sz"],["Etiopia","Afryka","et"],["Fidżi","Oceania","fj"],["Filipiny","Azja","ph"],["Finlandia","Europa","fi"],["Francja","Europa","fr"],["Gabon","Afryka","ga"],["Gambia","Afryka","gm"],["Ghana","Afryka","gh"],["Grecja","Europa","gr"],["Grenada","Ameryka Północna","gd"],["Gruzja","Azja","ge"],["Gujana","Ameryka Południowa","gy"],["Gwatemala","Ameryka Północna","gt"],["Gwinea","Afryka","gn"],["Gwinea Bissau","Afryka","gw"],["Gwinea Równikowa","Afryka","gq"],["Haiti","Ameryka Północna","ht"],["Hiszpania","Europa","es"],["Honduras","Ameryka Północna","hn"],["Indie","Azja","in"],["Indonezja","Azja","id"],["Irak","Azja","iq"],["Iran","Azja","ir"],["Irlandia","Europa","ie"],["Islandia","Europa","is"],["Izrael","Azja","il"],["Jamajka","Ameryka Północna","jm"],["Japonia","Azja","jp"],["Jemen","Azja","ye"],["Jordania","Azja","jo"],["Kambodża","Azja","kh"],["Kamerun","Afryka","cm"],["Kanada","Ameryka Północna","ca"],["Katar","Azja","qa"],["Kazachstan","Azja","kz"],["Kenia","Afryka","ke"],["Kirgistan","Azja","kg"],["Kiribati","Oceania","ki"],["Kolumbia","Ameryka Południowa","co"],["Komory","Afryka","km"],["Kongo","Afryka","cg"],["Korea Południowa","Azja","kr"],["Korea Północna","Azja","kp"],["Kostaryka","Ameryka Północna","cr"],["Kuba","Ameryka Północna","cu"],["Kuwejt","Azja","kw"],["Laos","Azja","la"],["Lesotho","Afryka","ls"],["Liban","Azja","lb"],["Liberia","Afryka","lr"],["Libia","Afryka","ly"],["Liechtenstein","Europa","li"],["Litwa","Europa","lt"],["Luksemburg","Europa","lu"],["Łotwa","Europa","lv"],["Madagaskar","Afryka","mg"],["Malawi","Afryka","mw"],["Malezja","Azja","my"],["Malediwy","Azja","mv"],["Mali","Afryka","ml"],["Malta","Europa","mt"],["Maroko","Afryka","ma"],["Mauretania","Afryka","mr"],["Mauritius","Afryka","mu"],["Meksyk","Ameryka Północna","mx"],["Mikronezja","Oceania","fm"],["Mołdawia","Europa","md"],["Monako","Europa","mc"],["Mongolia","Azja","mn"],["Mozambik","Afryka","mz"],["Mjanma","Azja","mm"],["Namibia","Afryka","na"],["Nauru","Oceania","nr"],["Nepal","Azja","np"],["Niderlandy","Europa","nl"],["Niemcy","Europa","de"],["Niger","Afryka","ne"],["Nigeria","Afryka","ng"],["Nikaragua","Ameryka Północna","ni"],["Norwegia","Europa","no"],["Nowa Zelandia","Oceania","nz"],["Oman","Azja","om"],["Pakistan","Azja","pk"],["Palau","Oceania","pw"],["Panama","Ameryka Północna","pa"],["Papua-Nowa Gwinea","Oceania","pg"],["Paragwaj","Ameryka Południowa","py"],["Peru","Ameryka Południowa","pe"],["Polska","Europa","pl"],["Portugalia","Europa","pt"],["RPA","Afryka","za"],["Republika Dominikańska","Ameryka Północna","do"],["Republika Środkowoafrykańska","Afryka","cf"],["Rumunia","Europa","ro"],["Rosja","Europa","ru"],["Rwanda","Afryka","rw"],["Saint Kitts i Nevis","Ameryka Północna","kn"],["Saint Lucia","Ameryka Północna","lc"],["Saint Vincent i Grenadyny","Ameryka Północna","vc"],["Salwador","Ameryka Północna","sv"],["Samoa","Oceania","ws"],["San Marino","Europa","sm"],["Senegal","Afryka","sn"],["Serbia","Europa","rs"],["Seszele","Afryka","sc"],["Sierra Leone","Afryka","sl"],["Singapur","Azja","sg"],["Słowacja","Europa","sk"],["Słowenia","Europa","si"],["Somalia","Afryka","so"],["Sri Lanka","Azja","lk"],["Stany Zjednoczone","Ameryka Północna","us"],["Sudan","Afryka","sd"],["Sudan Południowy","Afryka","ss"],["Surinam","Ameryka Południowa","sr"],["Syria","Azja","sy"],["Szwajcaria","Europa","ch"],["Szwecja","Europa","se"],["Tadżykistan","Azja","tj"],["Tajlandia","Azja","th"],["Tanzania","Afryka","tz"],["Timor Wschodni","Azja","tl"],["Togo","Afryka","tg"],["Tonga","Oceania","to"],["Trynidad i Tobago","Ameryka Północna","tt"],["Tunezja","Afryka","tn"],["Turcja","Azja","tr"],["Turkmenistan","Azja","tm"],["Tuvalu","Oceania","tv"],["Uganda","Afryka","ug"],["Ukraina","Europa","ua"],["Urugwaj","Ameryka Południowa","uy"],["Uzbekistan","Azja","uz"],["Vanuatu","Oceania","vu"],["Watykan","Europa","va"],["Wenezuela","Ameryka Południowa","ve"],["Węgry","Europa","hu"],["Wielka Brytania","Europa","gb"],["Wietnam","Azja","vn"],["Włochy","Europa","it"],["Wybrzeże Kości Słoniowej","Afryka","ci"],["Wyspy Marshalla","Oceania","mh"],["Wyspy Salomona","Oceania","sb"],["Zambia","Afryka","zm"],["Zimbabwe","Afryka","zw"],["Zjednoczone Emiraty Arabskie","Azja","ae"],["Zielony Przylądek","Afryka","cv"],["Macedonia Północna","Europa","mk"],["Mikronezja","Oceania","fm"],["Macedonia Północna","Europa","mk"]
];
const aliases={"USA":"Stany Zjednoczone","Stany Zjednoczone Ameryki":"Stany Zjednoczone","UK":"Wielka Brytania","Wielka Brytania":"Wielka Brytania","Holandia":"Niderlandy","Czechia":"Czechy","Korea Południowa":"Korea Południowa","Korea Płd.":"Korea Południowa","Korea Północna":"Korea Północna"};
const $=id=>document.getElementById(id);
const flag=$("flag"),covers=$("covers"),guess=$("guess"),message=$("message"),hint=$("hint"),result=$("result"),progress=$("progress");
let target,attempts,revealed,gameOver,hintUsed,score,order=[];
function norm(s){return s.toLocaleLowerCase("pl-PL").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l").replace(/[^a-z0-9 -]/g,"").replace(/\s+/g," ").trim()}
function flagUrl(code){return "https://flagcdn.com/w640/"+code+".png"}
function randomTarget(){return countries[Math.floor(Math.random()*countries.length)]}
function setup(){covers.innerHTML="";for(let i=0;i<6;i++){let d=document.createElement("div");d.className="cover";d.dataset.i=i;covers.appendChild(d)}order=[0,1,2,3,4,5].sort(()=>Math.random()-.5);revealed=0}
function update(){ $("attempt").textContent=Math.min(attempts+1,6)+" / 6";$("score").textContent=score;$("left").textContent=6-revealed;progress.innerHTML="";for(let i=0;i<6;i++){let d=document.createElement("div");d.className="dot"+(i<revealed?" used":"")+(i===revealed&&!gameOver?" current":"");progress.appendChild(d)}}
function revealOne(){if(revealed>=6)return;let el=covers.children[order[revealed]];el.classList.add("reveal");revealed++;update()}
function revealAll(){[...covers.children].forEach(x=>x.classList.add("reveal"));revealed=6;update()}
function setMsg(t,c="info"){message.textContent=t;message.className="message "+c}
function finish(win,reason){gameOver=true;revealAll();$("guessBtn").disabled=true;guess.disabled=true;$("hintBtn").disabled=true;$("giveBtn").style.display="none";$("newBtn").style.display="inline-block";let pts=win?Math.max(100,(6-attempts)*100+(hintUsed?-50:0)):0;score=pts;$("score").textContent=score;result.className="result show";result.innerHTML="<h2>"+(win?"🎉 Dobrze!":"🏳️ Koniec gry")+"</h2><p>Państwo: <strong>"+target[0]+"</strong></p><img src='"+flagUrl(target[2])+"' alt='Flaga "+target[0]+"'><p>"+(reason||"")+"</p>";}
function check(){if(gameOver)return;let raw=guess.value.trim();if(!raw){setMsg("Wpisz nazwę państwa.","bad");return}let a=aliases[raw]||raw;let ok=norm(a)===norm(target[0]);attempts++;if(ok){setMsg("Poprawna odpowiedź! 🎉","good");finish(true,"Zgadłeś po "+attempts+" próbie.");}else{revealOne();if(attempts>=6){setMsg("To była ostatnia próba.","bad");finish(false,"Nie udało się odgadnąć flagi.");}else{setMsg("Niestety, to nie to. Odkryto kolejny fragment.","bad");update()} }guess.value=""}
function useHint(){if(gameOver||hintUsed)return;hintUsed=true;hint.className="hint show";hint.innerHTML="🌎 Kontynent: <strong>"+target[1]+"</strong>";$("hintBtn").disabled=true;setMsg("Podpowiedź została użyta. Nie zabiera próby.","info")}
function giveUp(){if(gameOver)return;setMsg("Poddajesz się?","bad");finish(false,"Sam zakończyłeś grę.");}
function newGame(){target=randomTarget();attempts=0;gameOver=false;hintUsed=false;score=0;hint.className="hint";hint.textContent="";flag.src=flagUrl(target[2]);flag.onerror=()=>setMsg("Nie udało się pobrać flagi. Sprawdź połączenie z internetem.","bad");setup();$("guessBtn").disabled=false;guess.disabled=false;$("hintBtn").disabled=false;$("giveBtn").style.display="inline-block";$("newBtn").style.display="none";result.className="result";result.innerHTML="";setMsg("Flaga jest ukryta. Powodzenia!","info");update();guess.focus()}
countries.forEach(c=>{let o=document.createElement("option");o.value=c[0];$("countries").appendChild(o)});
$("guessBtn").onclick=check;$("hintBtn").onclick=useHint;$("giveBtn").onclick=giveUp;$("newBtn").onclick=newGame;guess.addEventListener("keydown",e=>{if(e.key==="Enter")check()});newGame();
</script>
</body>
</html>
