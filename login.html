<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie — ShadowTale.pl</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/logo.png">
<style>
:root{--bg:#03050d;--panel:rgba(9,12,27,.92);--border:rgba(139,92,246,.28);--purple:#8b5cf6;--blue:#38bdf8;--text:#f7f5ff;--muted:#9da3c0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.login-shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.auth-navbar{position:sticky;top:0;z-index:10;min-height:58px;padding:7px clamp(14px,3vw,32px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px;background:rgba(3,5,13,.9);border-bottom:1px solid rgba(139,92,246,.2);box-shadow:0 7px 25px rgba(0,0,0,.3);backdrop-filter:blur(16px)}
.auth-brand{justify-self:start;text-decoration:none;font-weight:900;white-space:nowrap}.neon-brand{font-size:20px;text-shadow:0 0 15px rgba(139,92,246,.45)}.shadow{color:#fff}.tale{color:#a78bfa;text-shadow:0 0 13px rgba(139,92,246,.85)}.pl{color:#38bdf8;text-shadow:0 0 12px rgba(56,189,248,.65)}
.auth-title{justify-self:center;font-size:12px;font-weight:800;letter-spacing:1.5px;color:#9fa3bd}.auth-back{justify-self:end;text-decoration:none;color:#d9d5ff;font-size:13px;font-weight:750;padding:8px 12px;border:1px solid rgba(139,92,246,.25);border-radius:10px;background:rgba(139,92,246,.07);transition:.2s}.auth-back:hover{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.55);transform:translateY(-1px)}
.auth-page{flex:1;display:grid;place-items:center;padding:55px 18px 65px}.auth-container{width:min(100%,460px)}.auth-box{position:relative;overflow:hidden;padding:34px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,rgba(15,18,40,.96),rgba(5,8,20,.94));box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 55px rgba(91,58,180,.12);backdrop-filter:blur(18px)}.auth-box:before{content:"";position:absolute;top:0;left:16%;right:16%;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--blue),transparent);box-shadow:0 0 18px rgba(139,92,246,.7)}
.section-title{text-align:center;margin-bottom:27px}.section-title span{font-size:11px;font-weight:900;letter-spacing:3px;color:var(--purple)}.section-title h2{margin:8px 0 0;font-size:36px;line-height:1.1;text-shadow:0 0 25px rgba(139,92,246,.25)}
.auth-form{display:grid;gap:9px}.auth-form label{margin-top:7px;font-size:13px;font-weight:750;color:#d9d8e8}.auth-form input{width:100%;height:48px;padding:0 14px;border:1px solid rgba(147,130,220,.24);border-radius:12px;outline:none;background:rgba(2,5,16,.8);color:#fff;font-size:14px;transition:.2s}.auth-form input::placeholder{color:#6f7591}.auth-form input:focus{border-color:rgba(139,92,246,.75);box-shadow:0 0 0 3px rgba(139,92,246,.12),0 0 22px rgba(139,92,246,.1)}
.password-wrapper{position:relative}.password-wrapper input{padding-right:52px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:38px;height:36px;border:0;border-radius:9px;background:transparent;color:#a9abc1;cursor:pointer;font-size:17px}.password-toggle:hover{background:rgba(139,92,246,.1);color:#fff}
.auth-submit{width:100%;min-height:49px;margin-top:12px;border:0;border-radius:12px;color:#fff;font-size:15px;font-weight:850;cursor:pointer;background:linear-gradient(100deg,#6938e5,#8b5cf6,#329edb);box-shadow:0 10px 30px rgba(91,57,190,.28);transition:.2s}.auth-submit:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 14px 35px rgba(91,57,190,.4)}.auth-submit:disabled{opacity:.65;cursor:wait}
.auth-message{min-height:20px;margin-top:5px;text-align:center;font-size:13px}.auth-message.error{color:#fb7185}.auth-message.success{color:#4ade80}
.auth-switch{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07);text-align:center;color:var(--muted);font-size:13px}.auth-switch a{color:#a78bfa;font-weight:850;text-decoration:none}.auth-switch a:hover{color:#c4b5fd;text-decoration:underline}
.system-status{display:none!important}
.auth-footer{padding:17px 20px;border-top:1px solid rgba(139,92,246,.17);background:rgba(3,5,13,.93);backdrop-filter:blur(16px);text-align:center;color:#7f849d;font-size:12px}.auth-footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;margin-bottom:7px}.auth-footer a{color:#a7a9c2;text-decoration:none}.auth-footer a:hover{color:#c4b5fd}.auth-footer strong{color:#aaa0e8}
@media(max-width:650px){.auth-navbar{grid-template-columns:1fr auto}.auth-title{display:none}.auth-box{padding:28px 20px;border-radius:18px}.auth-page{padding-top:35px;padding-bottom:45px}.section-title h2{font-size:30px}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="login-shell">
<header class="auth-navbar">
<a href="index.html" class="auth-brand" aria-label="ShadowTale.pl — strona główna"><span class="neon-brand"><span class="shadow">SHADOW</span><span class="tale">TALE</span><span class="pl">.PL</span></span></a>
<div class="auth-title">LOGOWANIE DO KONTA</div>
<a href="index.html" class="auth-back">← Wróć na stronę</a>
</header>
<main class="auth-page">
<div class="auth-container">
<section class="auth-box">
<div class="section-title"><span>SHADOWTALE.PL</span><h2>Zaloguj się</h2></div>
<form id="login-form" class="auth-form" novalidate>
<label for="login-email">Adres e-mail</label>
<input id="login-email" type="email" name="email" placeholder="twoj@email.pl" autocomplete="email" required>
<label for="login-password">Hasło</label>
<div class="password-wrapper"><input id="login-password" type="password" name="password" placeholder="Twoje hasło" autocomplete="current-password" minlength="6" required><button type="button" class="password-toggle" id="password-toggle" aria-label="Pokaż hasło">👁</button></div>
<div id="login-message" class="auth-message" aria-live="polite"></div>
<button id="login-submit" type="submit" class="auth-submit">Zaloguj się</button>
</form>
<div class="auth-switch">Nie masz jeszcze konta? <a href="rejestracja.html">Utwórz konto</a></div>
<div id="system-status" class="system-status">Ukryty status</div>
</section>
</div>
</main>
<footer class="auth-footer"><div class="auth-footer-links"><a href="index.html">Strona główna</a><a href="rejestracja.html">Rejestracja</a><a href="regulamin.html">Regulamin</a></div><div>© 2026 <strong>ShadowTale.pl</strong> — Twój świat, twoje zasady.</div></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";
document.addEventListener("DOMContentLoaded",()=>{
const canvas=document.getElementById("stars"),ctx=canvas.getContext("2d");let stars=[];
function resizeStars(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(180,Math.max(70,Math.floor(innerWidth/8)))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.25,s:Math.random()*.22+.04,a:Math.random()*.6+.2}));}
function animateStars(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const star of stars){star.y+=star.s;if(star.y>innerHeight+3){star.y=-3;star.x=Math.random()*innerWidth}ctx.globalAlpha=star.a;ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animateStars)}resizeStars();addEventListener("resize",resizeStars);animateStars();
const form=document.getElementById("login-form"),email=document.getElementById("login-email"),password=document.getElementById("login-password"),submit=document.getElementById("login-submit"),message=document.getElementById("login-message"),toggle=document.getElementById("password-toggle");
toggle.addEventListener("click",()=>{const show=password.type==="password";password.type=show?"text":"password";toggle.textContent=show?"🙈":"👁";toggle.setAttribute("aria-label",show?"Ukryj hasło":"Pokaż hasło")});
if(!window.supabase||!window.CONFIG?.supabaseUrl||!window.CONFIG?.supabaseKey){message.textContent="Nie udało się uruchomić systemu logowania.";message.classList.add("error");return}
const supabaseClient=window.supabase.createClient(window.CONFIG.supabaseUrl,window.CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="";message.className="auth-message";const mail=email.value.trim(),pass=password.value;if(!mail){message.textContent="Wpisz adres e-mail.";message.classList.add("error");email.focus();return}if(!pass){message.textContent="Wpisz hasło.";message.classList.add("error");password.focus();return}submit.disabled=true;submit.textContent="Logowanie...";try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:mail,password:pass});if(error)throw error;if(!data?.session||!data?.user)throw new Error("Nie udało się utworzyć sesji.");message.textContent="Zalogowano pomyślnie.";message.classList.add("success");submit.textContent="Zalogowano ✓";setTimeout(()=>window.location.replace("konto.html"),350)}catch(error){console.error("ShadowTale login error:",error);let text=error?.message||"Nie udało się zalogować.";const low=text.toLowerCase();if(low.includes("invalid login credentials"))text="Nieprawidłowy e-mail lub hasło.";else if(low.includes("email not confirmed"))text="Adres e-mail nie został jeszcze potwierdzony.";else if(low.includes("too many requests"))text="Zbyt wiele prób. Spróbuj ponownie za chwilę.";message.textContent=text;message.classList.add("error");submit.disabled=false;submit.textContent="Zaloguj się"}});
});
</script>
</body>
</html>
