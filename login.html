<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Zaloguj się — ShadowTale.pl</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<canvas id="stars"></canvas>

<header class="site-header">

    <a class="site-logo" href="index.html">
        <img src="assets/logo.png" alt="ShadowTale.pl">
        <span>ShadowTale.pl</span>
    </a>

    <div class="header-search">

        <input
            id="site-search"
            type="search"
            placeholder="Szukaj w ShadowTale..."
            autocomplete="off"
        >

        <div id="search-results" class="search-results"></div>

    </div>

    <button
        id="account-button"
        class="account-button"
        type="button"
    >
        Konto
    </button>

</header>


<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            <img src="assets/logo.png" alt="ShadowTale">
        </div>

        <span class="auth-label">
            SHADOWTALE • KONTO
        </span>

        <h1>
            Witaj ponownie
        </h1>

        <p class="auth-description">
            Zaloguj się, aby przejść do swojego konta ShadowTale.
        </p>


        <form id="login-form" class="auth-form">

            <div class="auth-field">

                <label for="email">
                    E-mail
                </label>

                <div class="auth-input-wrapper">
                    <span>✉</span>

                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="twoj@email.pl"
                    >
                </div>

            </div>


            <div class="auth-field">

                <label for="password">
                    Hasło
                </label>

                <div class="auth-input-wrapper">
                    <span>🔒</span>

                    <input
                        id="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        placeholder="Wpisz swoje hasło"
                    >
                </div>

            </div>


            <button
                class="auth-submit"
                type="submit"
            >
                Zaloguj się
                <span>→</span>
            </button>

        </form>


        <div
            id="login-status"
            class="auth-status"
        ></div>


        <div class="auth-divider">
            <span>lub</span>
        </div>


        <div class="auth-switch">

            <span>
                Nie masz jeszcze konta?
            </span>

            <a href="rejestracja.html">
                Utwórz konto
            </a>

        </div>

    </section>

</main>


<footer class="footer auth-footer">

    <div class="footer-links">
        <a href="index.html">Start</a>
        <a href="minecraft.html">Minecraft</a>
        <a href="undertale.html">Undertale</a>
        <a href="custom.html">Custom</a>
        <a href="discord.html">Discord</a>
        <a href="regulamin.html">Regulamin</a>
    </div>

    ShadowTale © 2026

</footer>


<script src="app.js"></script>

<script>

const form = document.getElementById("login-form");
const status = document.getElementById("login-status");

form?.addEventListener("submit", async event => {

    event.preventDefault();

    status.textContent = "Logowanie...";
    status.className = "auth-status loading";

    const email = document
        .getElementById("email")
        .value
        .trim();

    const password = document
        .getElementById("password")
        .value;

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        if (error) {
            status.textContent = error.message;
            status.className = "auth-status error";
            return;
        }

        status.textContent = "Zalogowano.";
        status.className = "auth-status success";

        window.location.href = "konto.html";

    } catch (error) {

        status.textContent =
            "Wystąpił błąd podczas logowania.";

        status.className = "auth-status error";

        console.error(error);
    }

});

</script>

</body>
</html>
