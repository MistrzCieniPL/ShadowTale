<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rejestracja — ShadowTale</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<canvas id="stars"></canvas>

<nav class="navbar">
    <a href="index.html" class="logo">
        Shadow<span>Tale</span>
    </a>

    <div class="nav-links">
        <a href="minecraft.html">Minecraft</a>
        <a href="undertale.html">Undertale</a>
        <a href="login.html">Logowanie</a>
    </div>
</nav>

<main class="container">

    <section class="category-hero">
        <h1>Utwórz konto</h1>
        <p>Załóż konto ShadowTale, aby móc korzystać z zakupów i swojego profilu.</p>
    </section>

    <section class="auth-box">

        <form id="register-form">

            <input
                type="text"
                id="register-username"
                placeholder="Nazwa użytkownika"
                minlength="3"
                maxlength="20"
                required
            >

            <input
                type="email"
                id="register-email"
                placeholder="Adres e-mail"
                required
            >

            <input
                type="password"
                id="register-password"
                placeholder="Hasło"
                minlength="8"
                required
            >

            <input
                type="password"
                id="register-password-confirm"
                placeholder="Powtórz hasło"
                minlength="8"
                required
            >

            <button type="submit" class="button primary">
                📝 Załóż konto
            </button>

        </form>

        <p id="auth-message" class="auth-message"></p>

        <p class="auth-switch">
            Masz już konto?
            <a href="login.html">Zaloguj się</a>
        </p>

    </section>

</main>

<footer>
    <p>© 2026 ShadowTale</p>
</footer>

<script src="scripts.js"></script>

</body>
</html>
