<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rejestracja — ShadowTale.pl</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg: #050712;
            --bg-2: #080b18;
            --panel: rgba(13, 17, 35, 0.94);

            --purple: #8b5cf6;
            --purple-light: #a78bfa;
            --blue: #5865f2;

            --text: #f5f7ff;
            --text-soft: #b8bfd7;
            --text-muted: #7f88a5;

            --border: rgba(139, 92, 246, 0.22);
            --border-light: rgba(255, 255, 255, 0.08);

            --success: #4ade80;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(88, 101, 242, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 40%,
                    rgba(139, 92, 246, 0.09),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           GWIAZDY
           ===================================================== */

        .stars-layer {
            position: fixed;
            inset: 0;

            z-index: -1;

            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;

            border-radius: 50%;

            opacity: 0.4;

            animation:
                starTwinkle 3s ease-in-out infinite alternate;
        }

        .star:nth-child(3n) {
            animation-duration: 4.5s;
        }

        .star:nth-child(4n) {
            width: 3px;
            height: 3px;
            opacity: 0.6;
            animation-duration: 5.5s;
        }

        .star:nth-child(5n) {
            opacity: 0.2;
            animation-duration: 6s;
        }

        @keyframes starTwinkle {
            from {
                opacity: 0.15;
                transform: scale(0.8);
            }

            to {
                opacity: 0.85;
                transform: scale(1.25);
            }
        }

        /* =====================================================
           GÓRNY PASEK
           ===================================================== */

        .register-header {
            position: relative;
            z-index: 100;

            width: 100%;
            min-height: 64px;

            padding: 8px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(5, 7, 18, 0.84);

            border-bottom:
                1px solid var(--border-light);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* =====================================================
           LOGO + SHADOWTALE.PL
           ===================================================== */

        .register-brand {
            display: inline-flex;
            align-items: center;

            gap: 8px;

            flex-shrink: 0;

            color: white;

            font-size: 18px;
            font-weight: 900;

            letter-spacing: -0.5px;
        }

        .register-brand img {
            width: 58px;
            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(139, 92, 246, 0.3)
                );
        }

        .register-brand .brand-purple {
            color: var(--purple-light);
        }

        /* =====================================================
           POWRÓT
           ===================================================== */

        .register-back {
            display: inline-flex;
            align-items: center;

            min-height: 38px;

            padding: 0 12px;

            color: var(--text-soft);

            background:
                rgba(255, 255, 255, 0.035);

            border:
                1px solid var(--border-light);

            border-radius: 10px;

            font-size: 13px;
            font-weight: 600;

            transition:
                color 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        .register-back:hover {
            color: white;

            background:
                rgba(139, 92, 246, 0.1);

            border-color:
                rgba(139, 92, 246, 0.45);

            transform: translateY(-1px);
        }

        /* =====================================================
           GŁÓWNA CZĘŚĆ
           ===================================================== */

        .register-main {
            position: relative;

            min-height:
                calc(100vh - 64px);

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding:
                55px 16px 70px;
        }

        .register-glow {
            position: absolute;

            top: 40px;
            left: 50%;

            width: 520px;
            height: 520px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, 0.13),
                    transparent 68%
                );

            filter: blur(20px);

            pointer-events: none;
        }

        /* =====================================================
           BOX
           ===================================================== */

        .register-box {
            position: relative;
            z-index: 2;

            width: min(520px, 100%);

            padding: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 23, 46, 0.97),
                    rgba(8, 11, 24, 0.98)
                );

            border:
                1px solid var(--border-light);

            border-radius: 24px;

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(139, 92, 246, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* =====================================================
           IKONA
           ===================================================== */

        .register-icon {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            margin: 0 auto 16px;

            border-radius: 14px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            box-shadow:
                0 10px 30px
                rgba(88, 101, 242, 0.25);

            font-size: 22px;
        }

        /* =====================================================
           NAGŁÓWEK
           ===================================================== */

        .register-heading {
            text-align: center;

            margin-bottom: 28px;
        }

        .register-eyebrow {
            display: block;

            margin-bottom: 6px;

            color: var(--purple-light);

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 2px;
        }

        .register-heading h1 {
            margin-bottom: 7px;

            font-size: 36px;

            line-height: 1.05;

            letter-spacing: -1px;

            font-weight: 900;
        }

        .register-heading p {
            color: var(--text-muted);

            font-size: 14px;
        }

        /* =====================================================
           POLA
           ===================================================== */

        .register-field {
            margin-bottom: 17px;
        }

        .register-field > label {
            display: block;

            margin-bottom: 7px;

            color: var(--text-soft);

            font-size: 13px;
            font-weight: 700;
        }

        .register-field input {
            width: 100%;
            min-height: 48px;

            padding:
                11px 14px;

            color: var(--text);

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid var(--border-light);

            border-radius: 12px;

            outline: none;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-field input::placeholder {
            color: #69728e;
        }

        .register-field input:focus {
            background:
                rgba(255, 255, 255, 0.065);

            border-color:
                rgba(139, 92, 246, 0.65);

            box-shadow:
                0 0 0 3px
                rgba(139, 92, 246, 0.08);
        }

        /* =====================================================
           HASŁO
           ===================================================== */

        .register-input-wrap {
            position: relative;
        }

        .register-input-wrap input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 7px;

            width: 38px;
            height: 38px;

            transform:
                translateY(-50%);

            display: grid;
            place-items: center;

            border: none;

            border-radius: 9px;

            color: var(--text-soft);

            background:
                rgba(255, 255, 255, 0.05);
        }

        .password-toggle:hover {
            color: white;

            background:
                rgba(139, 92, 246, 0.15);
        }

        /* =====================================================
           SIŁA HASŁA
           ===================================================== */

        .password-strength {
            margin-top: 11px;
        }

        .password-strength-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 7px;

            color: var(--text-muted);

            font-size: 12px;
        }

        .password-strength-top strong {
            color: var(--text-soft);
        }

        .password-strength-track {
            width: 100%;
            height: 7px;

            overflow: hidden;

            background:
                rgba(255, 255, 255, 0.07);

            border-radius: 999px;
        }

        .password-strength-bar {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: #ef4444;

            transition:
                width 0.25s ease,
                background 0.25s ease;
        }

        .password-strength-bar.very-weak {
            background: #ef4444;
        }

        .password-strength-bar.weak {
            background: #f97316;
        }

        .password-strength-bar.good {
            background: #eab308;
        }

        .password-strength-bar.strong {
            background: #22c55e;
        }

        /* =====================================================
           WYMAGANIA
           ===================================================== */

        .password-requirements {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 7px;

            margin-top: 11px;
        }

        .password-rule {
            min-height: 35px;

            display: flex;
            align-items: center;

            gap: 7px;

            padding:
                6px 8px;

            color: var(--text-muted);

            background:
                rgba(255, 255, 255, 0.025);

            border:
                1px solid var(--border-light);

            border-radius: 9px;

            font-size: 11px;

            transition:
                color 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .password-rule span {
            flex-shrink: 0;

            width: 18px;
            height: 18px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: #7f88a5;

            background:
                rgba(255, 255, 255, 0.06);

            font-size: 10px;
            font-weight: 900;
        }

        .password-rule.valid {
            color: #b8f7ca;

            border-color:
                rgba(74, 222, 128, 0.25);

            background:
                rgba(74, 222, 128, 0.06);
        }

        .password-rule.valid span {
            color: white;
            background: var(--success);
        }

        .password-rule.invalid {
            color: #fca5a5;

            border-color:
                rgba(248, 113, 113, 0.18);
        }

        .password-rule.invalid span {
            color: white;

            background:
                rgba(248, 113, 113, 0.55);
        }

        /* =====================================================
           ZGODNOŚĆ HASEŁ
           ===================================================== */

        .password-match {
            min-height: 19px;

            margin-top: 5px;

            font-size: 12px;
            font-weight: 600;
        }

        .password-match.success {
            color: var(--success);
        }

        .password-match.error {
            color: var(--danger);
        }

        /* =====================================================
           REGULAMIN
           ===================================================== */

        .register-checkbox {
            display: flex;
            align-items: flex-start;

            gap: 9px;

            margin:
                5px 0 15px;

            color: var(--text-muted);

            font-size: 12px;

            cursor: pointer;
        }

        .register-checkbox input {
            width: 17px;
            height: 17px;

            flex-shrink: 0;

            margin-top: 1px;

            accent-color: var(--purple);

            cursor: pointer;
        }

        .register-checkbox a {
            color: var(--purple-light);

            font-weight: 700;
        }

        .register-checkbox a:hover {
            color: white;
        }

        /* =====================================================
           KOMUNIKAT
           ===================================================== */

        .register-message {
            min-height: 20px;

            margin-bottom: 11px;

            text-align: center;

            font-size: 13px;
            font-weight: 600;
        }

        .register-message.error {
            color: var(--danger);
        }

        .register-message.success {
            color: var(--success);
        }

        /* =====================================================
           PRZYCISK
           ===================================================== */

        .register-submit {
            width: 100%;
            min-height: 50px;

            border: none;

            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            box-shadow:
                0 10px 30px
                rgba(88, 101, 242, 0.2);

            font-weight: 850;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-submit:hover {
            transform: translateY(-2px);

            filter: brightness(1.1);

            box-shadow:
                0 15px 35px
                rgba(88, 101, 242, 0.3);
        }

        .register-submit:active {
            transform: translateY(0);
        }

        /* =====================================================
           JEDEN LINK DO LOGOWANIA
           ===================================================== */

        .register-login-bottom {
            margin-top: 18px;

            text-align: center;

            color: var(--text-muted);

            font-size: 13px;
        }

        .register-login-bottom a {
            color: var(--purple-light);

            font-weight: 800;

            transition: color 0.2s ease;
        }

        .register-login-bottom a:hover {
            color: white;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .register-header {
                padding: 8px 12px;
            }

            .register-brand {
                gap: 6px;
                font-size: 15px;
            }

            .register-brand img {
                width: 48px;
            }

            .register-back {
                min-height: 34px;

                padding: 0 8px;

                font-size: 11px;
            }

            .register-main {
                padding:
                    30px 12px 55px;
            }

            .register-box {
                padding:
                    27px 17px;

                border-radius: 20px;
            }

            .register-heading h1 {
                font-size: 32px;
            }

            .password-requirements {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- GWIAZDY -->
    <div class="stars-layer" aria-hidden="true">
        <span class="star" style="left:5%;top:12%;"></span>
        <span class="star" style="left:13%;top:35%;"></span>
        <span class="star" style="left:21%;top:18%;"></span>
        <span class="star" style="left:31%;top:72%;"></span>
        <span class="star" style="left:42%;top:28%;"></span>
        <span class="star" style="left:53%;top:62%;"></span>
        <span class="star" style="left:64%;top:15%;"></span>
        <span class="star" style="left:73%;top:42%;"></span>
        <span class="star" style="left:84%;top:22%;"></span>
        <span class="star" style="left:94%;top:68%;"></span>
        <span class="star" style="left:8%;top:82%;"></span>
        <span class="star" style="left:27%;top:48%;"></span>
        <span class="star" style="left:48%;top:88%;"></span>
        <span class="star" style="left:69%;top:76%;"></span>
        <span class="star" style="left:88%;top:91%;"></span>
    </div>


    <!-- GÓRNY PASEK -->
    <header class="register-header">

        <a
            href="index.html"
            class="register-brand"
            aria-label="ShadowTale.pl — strona główna"
        >
            <img
                src="assets/logo.png"
                alt="ShadowTale"
            >

            <span>
                ShadowTale<span class="brand-purple">.pl</span>
            </span>
        </a>


        <a
            href="index.html"
            class="register-back"
        >
            ← Powrót na stronę główną
        </a>

    </header>


    <!-- GŁÓWNA CZĘŚĆ -->
    <main class="register-main">

        <div class="register-glow"></div>

        <section class="register-box">

            <div class="register-icon">
                ✦
            </div>


            <div class="register-heading">

                <span class="register-eyebrow">
                    SHADOWTALE.PL
                </span>

                <h1>
                    Stwórz konto
                </h1>

                <p>
                    Dołącz do ShadowTale i korzystaj ze swojego konta.
                </p>

            </div>


            <!-- FORMULARZ -->
            <form
                id="register-form"
                novalidate
            >

                <!-- NICK -->
                <div class="register-field">

                    <label for="register-username">
                        Nick
                    </label>

                    <input
                        type="text"
                        id="register-username"
                        name="username"
                        placeholder="Twój nick"
                        autocomplete="username"
                        minlength="3"
                        maxlength="24"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="register-field">

                    <label for="register-email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="twoj@email.pl"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- HASŁO -->
                <div class="register-field">

                    <label for="register-password">
                        Hasło
                    </label>

                    <div class="register-input-wrap">

                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder="Utwórz bezpieczne hasło"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Pokaż hasło"
                        >
                            👁
                        </button>

                    </div>


                    <!-- SIŁA -->
                    <div class="password-strength">

                        <div class="password-strength-top">

                            <span>
                                Siła hasła
                            </span>

                            <strong id="password-strength-text">
                                —
                            </strong>

                        </div>

                        <div class="password-strength-track">

                            <div
                                id="password-strength-bar"
                                class="password-strength-bar"
                            ></div>

                        </div>

                    </div>


                    <!-- WYMAGANIA -->
                    <div class="password-requirements">

                        <div
                            class="password-rule"
                            id="rule-length"
                        >
                            <span>✓</span>
                            Minimum 6 znaków
                        </div>

                        <div
                            class="password-rule"
                            id="rule-upper"
                        >
                            <span>✓</span>
                            Wielka litera
                        </div>

                        <div
                            class="password-rule"
                            id="rule-lower"
                        >
                            <span>✓</span>
                            Mała litera
                        </div>

                        <div
                            class="password-rule"
                            id="rule-number"
                        >
                            <span>✓</span>
                            Cyfra
                        </div>

                        <div
                            class="password-rule"
                            id="rule-special"
                        >
                            <span>✓</span>
                            Znak specjalny
                        </div>

                        <div
                            class="password-rule"
                            id="rule-predictable"
                        >
                            <span>✓</span>
                            Trudne do odgadnięcia
                        </div>

                    </div>

                </div>


                <!-- POWTÓRZ HASŁO -->
                <div class="register-field">

                    <label for="register-password-confirm">
                        Powtórz hasło
                    </label>

                    <input
                        type="password"
                        id="register-password-confirm"
                        name="passwordConfirm"
                        placeholder="Wpisz hasło ponownie"
                        autocomplete="new-password"
                        required
                    >

                    <div
                        id="password-match"
                        class="password-match"
                    ></div>

                </div>


                <!-- REGULAMIN -->
                <label class="register-checkbox">

                    <input
                        type="checkbox"
                        id="register-terms"
                        required
                    >

                    <span>
                        Akceptuję
                        <a href="regulamin.html">
                            regulamin
                        </a>
                        ShadowTale.
                    </span>

                </label>


                <!-- KOMUNIKAT -->
                <div
                    id="register-message"
                    class="register-message"
                    aria-live="polite"
                ></div>


                <!-- REJESTRACJA -->
                <button
                    type="submit"
                    id="register-submit"
                    class="register-submit"
                >
                    Stwórz konto
                </button>


                <!-- TYLKO JEDEN LINK DO LOGOWANIA -->
                <div class="register-login-bottom">

                    Masz już konto?
                    <a href="login.html">
                        Zaloguj się!
                    </a>

                </div>

            </form>

        </section>

    </main>


    <!-- APP -->
    <script src="app.js"></script>


    <!-- REJESTRACJA + 6 MECHANIK HASŁA -->
    <script>
    (() => {
        "use strict";

        function initRegistration() {
            const form = document.getElementById("register-form");
            const usernameInput = document.getElementById("register-username");
            const emailInput = document.getElementById("register-email");
            const password = document.getElementById("register-password");
            const passwordConfirm = document.getElementById("register-password-confirm");
            const terms = document.getElementById("register-terms");
            const toggle = document.getElementById("password-toggle");
            const bar = document.getElementById("password-strength-bar");
            const strengthText = document.getElementById("password-strength-text");
            const matchText = document.getElementById("password-match");
            const message = document.getElementById("register-message");
            const submit = document.getElementById("register-submit");

            const rules = {
                length: document.getElementById("rule-length"),
                upper: document.getElementById("rule-upper"),
                lower: document.getElementById("rule-lower"),
                number: document.getElementById("rule-number"),
                special: document.getElementById("rule-special"),
                predictable: document.getElementById("rule-predictable")
            };

            if (!form || !usernameInput || !emailInput || !password || !passwordConfirm || !terms || !submit) {
                console.error("ShadowTale: brak elementów formularza rejestracji.");
                return;
            }

            const commonPasswords = new Set([
                "password", "password123", "haslo", "haslo123", "haslo_123",
                "qwerty", "qwerty123", "123456", "12345678", "admin123",
                "admin1234", "minecraft", "minecraft123", "undertale", "shadowtale"
            ]);

            function setMessage(text, type = "") {
                message.textContent = text || "";
                message.className = "register-message" + (type ? " " + type : "");
            }

            function setRule(el, valid) {
                if (!el) return;
                el.classList.toggle("valid", valid);
                el.classList.toggle("invalid", !valid);
            }

            function passwordData(value) {
                const hasLength = value.length >= 6;
                const hasUpper = /[A-ZĄĆĘŁŃÓŚŹŻ]/.test(value);
                const hasLower = /[a-ząćęłńóśźż]/.test(value);
                const hasNumber = /[0-9]/.test(value);
                const hasSpecial = /[^A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż0-9]/.test(value);
                const lower = value.toLowerCase();
                const predictable =
                    commonPasswords.has(lower) ||
                    /^([a-z]+)[_ -]?123$/i.test(value) ||
                    /^123456/.test(value) ||
                    /(.)\1{3,}/.test(value);

                let score = 0;
                if (hasLength) score += 20;
                if (value.length >= 10) score += 10;
                if (value.length >= 14) score += 10;
                if (hasUpper) score += 15;
                if (hasLower) score += 15;
                if (hasNumber) score += 15;
                if (hasSpecial) score += 15;
                if (predictable) score = Math.min(score, 45);

                return { hasLength, hasUpper, hasLower, hasNumber, hasSpecial, predictable, score };
            }

            function updatePasswordStrength() {
                const value = password.value;

                if (!value) {
                    bar.style.width = "0%";
                    strengthText.textContent = "—";
                    Object.values(rules).forEach(el => el && el.classList.remove("valid", "invalid"));
                    updatePasswordMatch();
                    return;
                }

                const d = passwordData(value);
                setRule(rules.length, d.hasLength);
                setRule(rules.upper, d.hasUpper);
                setRule(rules.lower, d.hasLower);
                setRule(rules.number, d.hasNumber);
                setRule(rules.special, d.hasSpecial);
                setRule(rules.predictable, !d.predictable);

                bar.className = "password-strength-bar";
                bar.style.width = Math.min(d.score, 100) + "%";

                if (d.predictable || d.score < 40) {
                    strengthText.textContent = "Bardzo słabe";
                    bar.classList.add("very-weak");
                } else if (d.score < 60) {
                    strengthText.textContent = "Słabe";
                    bar.classList.add("weak");
                } else if (d.score < 80) {
                    strengthText.textContent = "Dobre";
                    bar.classList.add("good");
                } else {
                    strengthText.textContent = "Bardzo dobre";
                    bar.classList.add("strong");
                }

                updatePasswordMatch();
            }

            function updatePasswordMatch() {
                if (!passwordConfirm.value) {
                    matchText.textContent = "";
                    matchText.className = "password-match";
                    return;
                }

                if (password.value === passwordConfirm.value) {
                    matchText.textContent = "✓ Hasła są takie same";
                    matchText.className = "password-match success";
                } else {
                    matchText.textContent = "✕ Hasła nie są takie same";
                    matchText.className = "password-match error";
                }
            }

            function getSupabaseClient() {
                if (window.supabaseClient && typeof window.supabaseClient.auth?.signUp === "function") {
                    return window.supabaseClient;
                }
                if (window.authClient && typeof window.authClient.auth?.signUp === "function") {
                    return window.authClient;
                }

                const cfg = window.CONFIG || {};
                if (window.supabase?.createClient && cfg.supabaseUrl && cfg.supabaseKey) {
                    try {
                        const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
                        window.supabaseClient = client;
                        window.authClient = client;
                        return client;
                    } catch (error) {
                        console.error("ShadowTale: nie udało się utworzyć klienta Supabase.", error);
                    }
                }
                return null;
            }

            function translateSupabaseError(error) {
                const text = String(error?.message || error?.error_description || error || "");
                const lower = text.toLowerCase();

                if (lower.includes("user already registered") || lower.includes("already registered")) {
                    return "Konto z tym adresem e-mail już istnieje.";
                }
                if (lower.includes("password") && lower.includes("6")) {
                    return "Hasło musi mieć co najmniej 6 znaków.";
                }
                if (lower.includes("invalid email")) {
                    return "Podaj poprawny adres e-mail.";
                }
                if (lower.includes("signup is disabled")) {
                    return "Rejestracja jest obecnie wyłączona w Supabase.";
                }
                if (lower.includes("email rate limit")) {
                    return "Przekroczono limit wysyłania wiadomości e-mail. Spróbuj później.";
                }
                return text || "Nie udało się utworzyć konta.";
            }

            usernameInput.addEventListener("input", () => {
                usernameInput.value = usernameInput.value.replace(/\s+/g, " ");
            });

            password.addEventListener("input", updatePasswordStrength);
            passwordConfirm.addEventListener("input", updatePasswordMatch);

            if (toggle) {
                toggle.addEventListener("click", () => {
                    const visible = password.type === "text";
                    password.type = visible ? "password" : "text";
                    passwordConfirm.type = visible ? "password" : "text";
                    toggle.textContent = visible ? "👁" : "🙈";
                    toggle.setAttribute("aria-label", visible ? "Pokaż hasło" : "Ukryj hasło");
                });
            }

            form.addEventListener("submit", async event => {
                event.preventDefault();
                event.stopPropagation();

                if (submit.disabled) return;
                setMessage("");

                const username = usernameInput.value.trim();
                const email = emailInput.value.trim().toLowerCase();
                const data = passwordData(password.value);

                if (username.length < 3) {
                    setMessage("Nick musi mieć minimum 3 znaki.", "error");
                    usernameInput.focus();
                    return;
                }

                if (username.length > 24) {
                    setMessage("Nick może mieć maksymalnie 24 znaki.", "error");
                    usernameInput.focus();
                    return;
                }

                if (!/^[\p{L}\p{N}_. -]+$/u.test(username)) {
                    setMessage("Nick zawiera niedozwolone znaki.", "error");
                    usernameInput.focus();
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    setMessage("Podaj poprawny adres e-mail.", "error");
                    emailInput.focus();
                    return;
                }

                const validPassword =
                    data.hasLength &&
                    data.hasUpper &&
                    data.hasLower &&
                    data.hasNumber &&
                    data.hasSpecial &&
                    !data.predictable &&
                    data.score >= 70;

                if (!validPassword) {
                    setMessage("Hasło jest zbyt słabe. Spełnij wszystkie wymagania.", "error");
                    password.focus();
                    return;
                }

                if (password.value !== passwordConfirm.value) {
                    setMessage("Hasła nie są takie same.", "error");
                    passwordConfirm.focus();
                    return;
                }

                if (!terms.checked) {
                    setMessage("Musisz zaakceptować regulamin.", "error");
                    terms.focus();
                    return;
                }

                const client = getSupabaseClient();
                if (!client) {
                    setMessage("Nie udało się połączyć z systemem kont. Sprawdź config.js.", "error");
                    console.error("ShadowTale: brak klienta Supabase. Wymagane CONFIG.supabaseUrl i CONFIG.supabaseKey.");
                    return;
                }

                submit.disabled = true;
                submit.textContent = "Tworzenie konta...";

                try {
                    const { data: result, error } = await client.auth.signUp({
                        email,
                        password: password.value,
                        options: {
                            data: {
                                username
                            }
                        }
                    });

                    if (error) throw error;

                    const user = result?.user;

                    // Jeżeli tabela profiles istnieje i pozwala na zapis, uzupełniamy profil.
                    // Błąd tego dodatkowego zapisu nie blokuje utworzenia konta Auth.
                    if (user?.id && client.from) {
                        try {
                            await client.from("profiles").upsert(
                                {
                                    id: user.id,
                                    username
                                },
                                { onConflict: "id" }
                            );
                        } catch (profileError) {
                            console.warn("ShadowTale: konto utworzone, ale profil nie został uzupełniony.", profileError);
                        }
                    }

                    if (result?.session) {
                        setMessage("Konto zostało utworzone. Przekierowanie...", "success");
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 900);
                    } else {
                        setMessage("Konto zostało utworzone. Sprawdź e-mail i potwierdź konto, a następnie się zaloguj.", "success");
                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 2200);
                    }
                } catch (error) {
                    console.error("ShadowTale registration error:", error);
                    setMessage(translateSupabaseError(error), "error");
                    submit.disabled = false;
                    submit.textContent = "Stwórz konto";
                }
            });

            updatePasswordStrength();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initRegistration, { once: true });
        } else {
            initRegistration();
        }
    })();
    </script>
