<!doctype html>
<html lang="pl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Custom — ShadowTale.pl</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<canvas id="stars"></canvas>

<header class="site-header">

<a class="site-logo" href="index.html">
<img src="assets/logo.png" alt="ShadowTale.pl">
<span>ShadowTale.pl</span>
</a>

<div class="header-search">
<input id="site-search" type="search" placeholder="Szukaj..." autocomplete="off">
<div id="search-results" class="search-results"></div>
</div>

<button id="account-button" class="account-button" type="button">Konto</button>

</header>

<main class="container">

<section class="form-card card">

<h1>🛠 Zamów Custom</h1>

<p>
Opisz projekt, który chcesz stworzyć.
</p>

<form>

<div class="form-group">

<label for="custom-name">
Nazwa projektu
</label>

<input
id="custom-name"
type="text"
placeholder="Np. system dusz"
>

</div>

<div class="form-group">

<label for="custom-type">
Typ projektu
</label>

<select id="custom-type">

<option>Minecraft</option>
<option>Undertale</option>
<option>Inne</option>

</select>

</div>

<div class="form-group">

<label for="custom-description">
Opis
</label>

<textarea
id="custom-description"
placeholder="Opisz dokładnie swój pomysł..."
></textarea>

</div>

<button
class="btn primary"
type="button"
onclick="alert('Formularz zamówienia zostanie podłączony do systemu Custom.')"
>
Wyślij zamówienie
</button>

</form>

</section>

</main>

<footer class="footer">
<div class="footer-links">
<a href="index.html">Start</a>
<a href="minecraft.html">Minecraft</a>
<a href="undertale.html">Undertale</a>
<a href="custom.html">Custom</a>
<a href="discord.html">Discord</a>
<a href="regulamin.html">Regulamin</a>
</div>
ShadowTale © 2026
</footer>

<script src="app.js"></script>

</body>
</html>
