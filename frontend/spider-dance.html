<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spider Dance — ShadowTale.pl</title>
  <link rel="icon" href="assets/logo.png">

  <style>
    :root {
      --bg: #050509;
      --panel: rgba(15, 12, 25, .96);
      --purple: #9b5cff;
      --purple2: #6d35c9;
      --text: #fff;
      --muted: #aaa4b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(155, 92, 255, .12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      border-bottom: 1px solid rgba(155, 92, 255, .25);
      background: rgba(5, 5, 9, .95);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .logo span {
      color: var(--purple);
    }

    main {
      width: min(1100px, calc(100% - 30px));
      margin: 45px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: var(--muted);
      text-decoration: none;
      transition: .2s;
    }

    .back:hover {
      color: var(--purple);
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(155, 92, 255, .35);
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 0 35px rgba(0, 0, 0, .4);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 16px;
    }

    .video-container {
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(155, 92, 255, .4);
      box-shadow: 0 0 30px rgba(155, 92, 255, .12);
    }

    video {
      width: 100%;
      max-height: 70vh;
      display: block;
      background: #000;
    }

    .info {
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(155, 92, 255, .06);
      border: 1px solid rgba(155, 92, 255, .15);
      color: var(--muted);
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      font-weight: bold;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(155, 92, 255, .25);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .btn.secondary:hover {
      border-color: var(--purple);
    }

    @media (max-width: 700px) {
      header {
        padding: 0 15px;
      }

      main {
        margin: 25px auto;
      }

      .panel {
        padding: 20px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="ShadowTale">
      <div>Shadow<span>Tale.pl</span></div>
    </div>
  </header>

  <main>

    <a href="muzyka.html" class="back">← Wróć do muzyki</a>

    <section class="panel">

      <h1>🕷️ Spider Dance</h1>

      <p class="subtitle">
        Undertale — wersja angielska
      </p>

      <div class="video-container">
        <video controls preload="metadata">
          <source src="assets/music/spider-dance.mp4" type="video/mp4">
          Twoja przeglądarka nie obsługuje odtwarzania tego filmu.
        </video>
      </div>

      <div class="info">
        <strong>Spider Dance</strong><br>
        Wersja: 🇬🇧 Angielski
      </div>

      <div class="buttons">
        <a href="muzyka.html" class="btn">🎵 Wszystkie utwory</a>
        <a href="index.html" class="btn secondary">← Strona główna</a>
      </div>

    </section>

  </main>

</body>
</html>
