<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Traits of the Seven — ShadowTale.pl</title>
  <link rel="icon" href="assets/logo.png">

  <style>
    :root {
      --bg: #050509;
      --panel: rgba(15, 12, 25, .96);
      --purple: #9b5cff;
      --purple2: #6d35c9;
      --text: #fff;
      --muted: #aaa4b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(155, 92, 255, .12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      border-bottom: 1px solid rgba(155, 92, 255, .25);
      background: rgba(5, 5, 9, .95);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .logo span {
      color: var(--purple);
    }

    main {
      width: min(1100px, calc(100% - 30px));
      margin: 45px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: var(--muted);
      text-decoration: none;
      transition: .2s;
    }

    .back:hover {
      color: var(--purple);
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(155, 92, 255, .35);
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 0 35px rgba(0, 0, 0, .4);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 16px;
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .version-card {
      padding: 30px 20px;
      border-radius: 15px;
      border: 1px solid rgba(155, 92, 255, .25);
      background: rgba(255, 255, 255, .025);
      cursor: pointer;
      transition: .25s;
      text-align: center;
    }

    .version-card:hover {
      transform: translateY(-4px);
      border-color: var(--purple);
      background: rgba(155, 92, 255, .08);
      box-shadow: 0 10px 30px rgba(155, 92, 255, .12);
    }

    .icon {
      font-size: 44px;
      margin-bottom: 14px;
    }

    .version-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .version-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      font-weight: bold;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(155, 92, 255, .25);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .btn.secondary:hover {
      border-color: var(--purple);
    }

    /* ODTWARZACZ */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      z-index: 100;
    }

    .overlay.active {
      display: flex;
    }

    .player {
      width: min(1000px, 100%);
      position: relative;
      background: #08070d;
      border: 1px solid rgba(155, 92, 255, .45);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 0 50px rgba(0, 0, 0, .7);
    }

    .player video {
      width: 100%;
      max-height: 75vh;
      display: block;
      background: #000;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      right: 10px;
      top: -45px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #17131f;
      color: white;
      font-size: 22px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .15);
      transition: .2s;
    }

    .close:hover {
      background: var(--purple);
      transform: scale(1.05);
    }

    @media (max-width: 700px) {
      header {
        padding: 0 15px;
      }

      main {
        margin: 25px auto;
      }

      .panel {
        padding: 20px;
      }

      h1 {
        font-size: 29px;
      }

      .versions {
        grid-template-columns: 1fr;
      }

      .close {
        right: 5px;
        top: -48px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="ShadowTale">
      <div>Shadow<span>Tale.pl</span></div>
    </div>
  </header>

  <main>

    <a href="muzyka.html" class="back">← Wróć do muzyki</a>

    <section class="panel">

      <h1>❤️ Traits of the Seven</h1>

      <p class="subtitle">
        Undertale — wybierz wersję
      </p>

      <div class="versions">

        <div
          class="version-card"
          onclick="openPlayer('assets/music/traits-fight.mp4')"
        >
          <div class="icon">⚔️</div>
          <h2>Traits — Fight</h2>
          <p>Wersja Fight</p>
        </div>

        <div
          class="version-card"
          onclick="openPlayer('assets/music/traits-determined.mp4')"
        >
          <div class="icon">❤️</div>
          <h2>Traits — Determined</h2>
          <p>Wersja Determined</p>
        </div>

      </div>

      <div class="buttons">
        <a href="muzyka.html" class="btn">🎵 Wszystkie utwory</a>
        <a href="index.html" class="btn secondary">← Strona główna</a>
      </div>

    </section>

  </main>

  <div class="overlay" id="overlay" onclick="outsideClick(event)">

    <div class="player">

      <button class="close" onclick="closePlayer()">✕</button>

      <video id="videoPlayer" controls autoplay>
        <source id="videoSource" src="" type="video/mp4">
        Twoja przeglądarka nie obsługuje odtwarzania tego filmu.
      </video>

    </div>

  </div>

  <script>
    const overlay = document.getElementById("overlay");
    const videoPlayer = document.getElementById("videoPlayer");
    const videoSource = document.getElementById("videoSource");

    function openPlayer(video) {
      videoSource.src = video;
      videoPlayer.load();

      overlay.classList.add("active");

      videoPlayer.play().catch(() => {});
    }

    function closePlayer() {
      videoPlayer.pause();
      videoPlayer.currentTime = 0;
      videoSource.src = "";

      overlay.classList.remove("active");
    }

    function outsideClick(event) {
      if (event.target === overlay) {
        closePlayer();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePlayer();
      }
    });
  </script>

</body>
</html>
